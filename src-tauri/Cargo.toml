[package]
name = "paper-reader"
version = "0.1.0"
description = "Paper Reader desktop app"
authors = ["GitHub Copilot"]
edition = "2021"

[lib]
name = "paper_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
anyhow = "1.0.93"
chrono = { version = "0.4.38", features = ["serde"] }
reqwest = { version = "0.12.9", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "io-util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
keyring = "3.6.1"
quick-xml = { version = "0.36.2", features = ["serialize"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
